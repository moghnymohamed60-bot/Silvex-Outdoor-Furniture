version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: silvex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: silvex_outdoor
    ports:
      - "5432:5432"
    volumes:
      - silvex_pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silvex_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/silvex_outdoor?schema=public
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - postgres

volumes:
  silvex_pgdata:
